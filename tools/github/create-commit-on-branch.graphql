mutation CreateVerifiedCommit($input: CreateCommitOnBranchInput!) {
  createCommitOnBranch(input: $input) {
    commit {
      oid
      url
      tree { oid }
      author { name user { login } }
      committer { name user { login } }
      signature {
        isValid
        state
        wasSignedByGitHub
      }
    }
    ref { name }
  }
}
