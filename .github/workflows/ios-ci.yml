name: Native iOS validation
on:
  workflow_call:
permissions:
  contents: read
jobs:
  ios-build-test:
    name: ios-build-test
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build and test on an available iPhone simulator
        run: python3 .github/checks/native.py test
      - name: Preserve diagnostics and test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/*.log
            artifacts/*.xcresult
          if-no-files-found: warn
          retention-days: 5
